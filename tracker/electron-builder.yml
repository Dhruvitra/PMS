appId: com.shreejisoftware.producteev-tracker
productName: Producteev Tracker
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: producteev-tracker
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # oneClick's default behavior launches the app the instant install finishes -- for an
  # unsigned .exe (no code-signing cert configured here), that's exactly when Windows
  # SmartScreen/Defender do their slowest first-look scan of a brand-new unrecognized
  # executable, which read as "the app takes forever to load right after installing."
  # Showing the normal install wizard and NOT auto-launching decouples the two, so first
  # launch happens on the employee's own double-click once the install is fully settled.
  oneClick: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
